networks:
  npm_default:
    external: true

services:
  # Base de données MongoDB (non exposée sur l'hôte : accessible uniquement via le réseau Docker)
  mongodb:
    # Fixer la version réellement utilisée : docker exec emergent-mongodb mongod --version
    image: mongo:${MONGO_VERSION:?MONGO_VERSION}
    container_name: emergent-mongodb
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v mongosh >/dev/null 2>&1; then
            mongosh --quiet --host 127.0.0.1 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)';
          else
            mongo --quiet --host 127.0.0.1 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 2)';
          fi
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD}
    networks:
      - npm_default

  # API Backend (FastAPI)
  backend:
    build: ./backend
    container_name: emergent-backend
    restart: unless-stopped
    volumes:
      - resources-data:/app/storage
      - ./activity-video:/data/activity:ro
      - ./ai_config:/app/ai_config
      - karaoke-music:/data/karaoke
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - npm_default

  # Application Frontend (React)
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=https://api.loasis.app
    container_name: emergent-frontend
    depends_on:
      - backend
    networks:
      - npm_default

  # Voice uses profile karaoke; the legacy heavy CPU worker needs explicit karaoke-cpu.
  karaoke-preparation:
    profiles: [karaoke-cpu]
    build:
      context: ./backend
      dockerfile: Dockerfile.karaoke
    env_file: [.env]
    environment:
      KARAOKE_PREPARATION_MODE: server
      KARAOKE_CPU_THREADS: "2"
      KARAOKE_WHISPER_MODEL: base
      KARAOKE_DEMUCS_ENABLED: "true"
    volumes:
      - resources-data:/app/storage
      - karaoke-music:/data/karaoke:ro
      - karaoke-models:/models
    cpus: 2
    mem_limit: 6g
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks: [npm_default]

  karaoke-voice:
    profiles: [karaoke]
    build: ./karaoke-voice
    env_file: [.env]
    environment:
      KARAOKE_BACKEND_URL: http://backend:8000/api/activity/karaoke
    depends_on: [backend]
    restart: unless-stopped
    networks: [npm_default]

volumes:
  karaoke-music:
  karaoke-models:
  mongo-data:
  resources-data:
