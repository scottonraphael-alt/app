version: '3.8'

networks:
  npm_default:
    external: true

services:
  mongodb:
    image: mongo:latest
    container_name: emergent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    networks:
      - npm_default

  backend:
    build: ./backend
    container_name: emergent-backend
    env_file:
      - .env
    depends_on:
      - mongodb
      - classifier-service
      - llm-service
    networks:
      - npm_default

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://api.loasis.app
    container_name: emergent-frontend
    depends_on:
      - backend
    networks:
      - npm_default

  discord-listener:
    build: ./discord_listener
    container_name: emergent-discord-listener
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 200m

  classifier-service:
    build: ./classifier_service
    container_name: emergent-classifier
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 400m

  llm-service:
    build: ./llm_service
    container_name: emergent-llm
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 512m

volumes:
  mongo-data:
