version: '3.8'
networks:
  npm_default:
    external: true

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:latest
    container_name: emergent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    networks:
      - npm_default

  # API Backend (FastAPI)
  backend:
    build: ./backend
    container_name: emergent-backend
    env_file:
      - .env
    depends_on:
      - mongodb
      - classifier-service
      - llm-service
    networks:
      - npm_default

  # Application Frontend (React)
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=https://api.loasis.app
    container_name: emergent-frontend
    depends_on:
      - backend
    networks:
      - npm_default

  # Listener Discord temps réel (Gateway) - modération automatique
  discord-listener:
    build: ./discord_listener
    container_name: emergent-discord-listener
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 200m

  # Triage rapide (classifieur ONNX de toxicité)
  classifier-service:
    build: ./classifier_service
    container_name: emergent-classifier
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 400m

  # Jugement fin (Qwen2.5-1.5B via llama.cpp, règlement en contexte)
  llm-service:
    build: ./llm_service
    container_name: emergent-llm
    networks:
      - npm_default
    restart: unless-stopped
    mem_limit: 2200m

volumes:
  mongo-data:
