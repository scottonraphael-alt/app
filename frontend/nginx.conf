# Les Activities Discord chargent l'app dans une iframe (URL avec ?frame_id=...).
# Pour ces requêtes uniquement, on autorise l'embarquement par Discord.
map $arg_frame_id $iris_xfo {
    default "SAMEORIGIN";
    "~."    "";
}

map $arg_frame_id $iris_frame_ancestors {
    default "'self'";
    "~."    "https://discord.com https://*.discord.com https://discordapp.com https://*.discordapp.com https://*.discordsays.com";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # --- En-têtes de sécurité ---
    # Note : pas d'add_header dans les location (ça désactiverait l'héritage) -> on utilise `expires`.
    add_header X-Frame-Options $iris_xfo always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://api.loasis.app wss://api.loasis.app wss://*.discordsays.com https://discord.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $iris_frame_ancestors" always;

    # --- Cache ---
    # Fichiers hashés de CRA : cache longue durée
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Autres assets
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|mp4|webm)$ {
        expires 30d;
        try_files $uri =404;
    }

    # index.html ne doit jamais rester en cache (sinon anciens bundles après déploiement)
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
